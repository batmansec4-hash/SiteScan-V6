{% extends "base.html" %}{% block body %}
<h1>{{ "Create account" if mode == "signup" else "Log in" }}</h1>
{% if error %}<p class="critical">{{ error }}</p>{% endif %}
<form method="post" action="/{{ mode }}">
<p><input name="email" type="email" placeholder="Email" required></p>
<p><input name="password" type="password" placeholder="Password (10+ characters)" required></p>
<button>{{ "Sign up" if mode == "signup" else "Log in" }}</button></form>
{% endblock %}
